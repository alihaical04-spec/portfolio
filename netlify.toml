# Netlify configuration for Vite + React SPA
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

# Node version for the build environment
[build.environment]
  NODE_VERSION = "20"

# SPA fallback: all routes serve index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
